<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vastu Map Analyzer</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Konva for Canvas -->
    <script src="https://unpkg.com/konva@9/konva.min.js"></script>
    
    <!-- PDF.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    </script>

    <!-- jsPDF for PDF Generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar controls -->
        <aside class="sidebar">
            <div class="logo-container">
                <h1>Vastu Analyzer</h1>
                <p>Map & Chakra Analysis</p>
            </div>
            
            <div class="control-panel">
                <div class="panel-section">
                    <h3>1. Upload Map</h3>
                    <div class="upload-area" id="drop-zone">
                        <input type="file" id="file-input" accept="image/*,application/pdf" hidden>
                        <button id="upload-btn" class="primary-btn">Choose Image or PDF</button>
                        <p class="small-text">Drag & drop supported</p>
                    </div>
                </div>

                <div class="panel-section">
                    <h3>2. Map Controls</h3>
                    <div class="btn-group">
                        <button id="rotate-left-btn" class="secondary-btn" disabled>↺ Rotate Left</button>
                        <button id="rotate-right-btn" class="secondary-btn" disabled>Rotate Right ↻</button>
                    </div>
                </div>

                <div class="panel-section">
                    <h3>3. Define Boundaries</h3>
                    <p class="instructions">Click 4 points on the map to define the plot corners.</p>
                    <button id="select-points-btn" class="secondary-btn" disabled>Start Selection</button>
                    <button id="clear-points-btn" class="danger-btn" disabled>Clear Points</button>
                    <div class="checkbox-container">
                        <input type="checkbox" id="show-diagonals" checked>
                        <label for="show-diagonals">Show diagonal lines</label>
                    </div>
                </div>
                
                <div class="panel-section">
                    <h3>4. Vastu Chakra</h3>
                    <div class="slider-container">
                        <label for="chakra-opacity">Opacity: <span id="opacity-val">70%</span></label>
                        <input type="range" id="chakra-opacity" min="0" max="2" step="0.1" value="0.7" disabled>
                    </div>
                    <div class="slider-container">
                        <label for="chakra-rotation">Rotation: <span id="rotation-val">0°</span></label>
                        <input type="range" id="chakra-rotation" min="0" max="360" step="1" value="0" disabled>
                        <div class="input-group">
                            <input type="number" id="chakra-rotation-input" min="0" max="360" value="0" placeholder="Enter degrees" disabled>
                            <span class="input-suffix">°</span>
                        </div>
                    </div>
                    <div class="slider-container">
                        <label for="chakra-size">Size: <span id="size-val">1.0x</span></label>
                        <input type="range" id="chakra-size" min="0.5" max="2" step="0.1" value="1" disabled>
                    </div>
                    <button id="toggle-chakra-btn" class="secondary-btn" disabled>Show Chakra</button>
                    <button id="download-map-btn" class="primary-btn" disabled>Download Map (PNG)</button>
                </div>
            </div>
        </aside>

        <!-- Main Canvas Area -->
        <main class="canvas-area">
            <div id="canvas-container">
                <div id="placeholder" class="placeholder-text">
                    <h2>Upload a Map to Start</h2>
                    <p>Supported formats: JPG, PNG, PDF</p>
                </div>
            </div>
        </main>
    </div>

    <!-- Custom JS -->
    <script src="app.js"></script>
</body>
</html>
